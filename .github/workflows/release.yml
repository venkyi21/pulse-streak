name: Release

# Tag-driven releases: `git tag v1.0.1 && git push origin v1.0.1`.
# The tag must match package.json "version" or the build fails early, so a
# published artifact is always traceable to an exact commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build an unsigned AAB without creating a release'
        type: boolean
        default: true

permissions:
  contents: write        # needed to create the GitHub Release

jobs:
  release:
    name: Signed Android bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Don't rely on whatever SDK platforms happen to be baked into the runner
      # image — pin them and accept the licences explicitly, so a runner image
      # update can't break releases.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Gate: never ship a build that fails the suite.
      - name: Preflight (tests, boot check, version consistency)
        run: npm test && npm run check

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-version.js --check --expect-tag "${GITHUB_REF_NAME}"

      - name: Fail early if the Android project is not committed
        run: |
          if [ ! -d android ]; then
            echo "::error::android/ is missing. Run 'npm run android:add' locally and commit it."
            exit 1
          fi

      - name: Build web payload and sync Capacitor
        run: |
          npm run build:www
          npx cap sync android
          npm run version:sync
          npm run android:patch

      # The keystore lives only in secrets, base64-encoded. It is written to the
      # runner's temp dir and removed in a step that always runs.
      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "PS_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Build release bundle (.aab) and apk
        working-directory: android
        env:
          PS_KEYSTORE_PATH: ${{ env.PS_KEYSTORE_PATH }}
          PS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Name the artifacts after the version
        id: artifacts
        run: |
          V=$(node -p "require('./version.json').versionName")
          C=$(node -p "require('./version.json').versionCode")
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/*.aab "dist/pulse-streak-${V}-${C}.aab"
          cp android/app/build/outputs/apk/release/*.apk "dist/pulse-streak-${V}-${C}.apk" || true
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "code=${C}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulse-streak-${{ steps.artifacts.outputs.version }}
          path: dist/*
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Pulse Streak ${{ steps.artifacts.outputs.version }}**
            versionCode `${{ steps.artifacts.outputs.code }}`

            Download the `.aab` below and upload it in the Indus Appstore
            developer console (Google Play accepts the same file).

            Store listing graphics are in `store-assets/`.

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"
