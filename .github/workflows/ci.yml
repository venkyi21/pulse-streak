name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests & build sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The test suite itself needs zero dependencies (node:test only), so this
      # stays green even before Capacitor is installed.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Unit + integration tests
        run: npm test

      - name: index.html parses, evaluates and boots
        run: npm run check

      - name: Version consistency (package.json / index.html / gradle)
        run: npm run version:check

      - name: Web payload builds and is fully offline
        run: npm run build:www

      # Smoke test only. A byte-for-byte comparison against the committed PNGs
      # looked appealing but is wrong: zlib's deflate output is not guaranteed
      # stable across Node/zlib versions, so identical artwork can compress to
      # different bytes and fail the build for no reason.
      - name: Store assets regenerate from the shipped art
        run: npm run assets

      - name: Store assets are non-empty and the expected size
        run: |
          node -e "
          const fs=require('fs');
          const want={'icon-512.png':[512,512],'icon-adaptive-fg-432.png':[432,432],
            'icon-adaptive-bg-432.png':[432,432],'feature-graphic-1024x500.png':[1024,500],
            'screenshot-1-play.png':[1080,1920]};
          let bad=[];
          for(const [f,[w,h]] of Object.entries(want)){
            const p='store-assets/'+f;
            if(!fs.existsSync(p)){ bad.push(f+' missing'); continue; }
            const b=fs.readFileSync(p);
            if(b.length<1000){ bad.push(f+' suspiciously small'); continue; }
            // PNG IHDR: width/height are big-endian uint32 at bytes 16 and 20
            const gw=b.readUInt32BE(16), gh=b.readUInt32BE(20);
            if(gw!==w||gh!==h) bad.push(f+' is '+gw+'x'+gh+', expected '+w+'x'+h);
          }
          if(bad.length){ console.error('::error::'+bad.join('; ')); process.exit(1); }
          console.log('all store assets present at the expected dimensions');
          "
